<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>外送分攤計算機</title>
<style>
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --primary: #ff6b35;
    --primary-dark: #e5551f;
    --border: #e3e6ee;
    --danger: #d93f3f;
    --ok: #1f9d55;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161c;
      --card: #1e2129;
      --text: #eceef4;
      --muted: #9aa1b2;
      --border: #333847;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 1.6rem; margin: 8px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 1.05rem; margin: 0 0 12px; }
  label { display: block; font-size: .9rem; color: var(--muted); margin-bottom: 4px; }
  input[type="number"], input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
  }
  input:focus { outline: 2px solid var(--primary); border-color: transparent; }
  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  .person {
    display: grid;
    grid-template-columns: 1fr 1fr 40px;
    gap: 8px;
    margin-bottom: 8px;
    align-items: center;
  }
  .person .del {
    height: 40px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--danger);
    border-radius: 10px;
    font-size: 1.1rem;
    cursor: pointer;
  }
  button.btn {
    width: 100%;
    padding: 12px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  .btn-add { background: transparent; border: 1px dashed var(--border) !important; color: var(--text); margin-top: 4px; }
  .btn-add:hover { border-color: var(--primary) !important; color: var(--primary); }
  .btn-submit { background: var(--primary); color: #fff; font-size: 1.05rem; }
  .btn-submit:hover { background: var(--primary-dark); }
  .btn-reset { background: transparent; color: var(--muted); margin-top: 8px; font-weight: 400; }
  .msg { padding: 10px 12px; border-radius: 10px; font-size: .9rem; margin-top: 12px; }
  .msg.err { background: rgba(217,63,63,.12); color: var(--danger); }
  .msg.warn { background: rgba(255,170,0,.15); color: #b36b00; }
  @media (prefers-color-scheme: dark) { .msg.warn { color: #ffb84d; } }
  .summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
  .summary div { background: var(--bg); border-radius: 10px; padding: 10px 12px; }
  .summary small { color: var(--muted); display: block; font-size: .8rem; }
  .summary b { font-size: 1.1rem; }
  .summary .total { grid-column: 1 / -1; background: rgba(255,107,53,.12); }
  .summary .total b { color: var(--primary); font-size: 1.4rem; }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  th, td { padding: 8px 6px; text-align: right; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: .8rem; }
  td.pay { font-weight: 700; color: var(--primary); }
  tfoot td { font-weight: 700; border-bottom: none; }
  .hint { color: var(--muted); font-size: .8rem; margin-top: 10px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>哈哈 外送分攤計算機</h1>
  <p class="sub">依每個人的點單金額比例，分攤外送費與平台費。</p>

  <div class="card">
    <h2>1. 訂單金額</h2>
    <div class="field">
      <label for="orderTotal">點單金額（餐點總額）</label>
      <input type="number" id="orderTotal" min="0" step="any" inputmode="decimal" placeholder="例如 500">
    </div>
    <div class="field">
      <label for="deliveryFee">外送費</label>
      <input type="number" id="deliveryFee" min="0" step="any" inputmode="decimal" placeholder="例如 40">
    </div>
    <div class="field">
      <label for="platformFee">平台費</label>
      <input type="number" id="platformFee" min="0" step="any" inputmode="decimal" placeholder="例如 15">
    </div>
  </div>

  <div class="card">
    <h2>2. 點單人員</h2>
    <div id="people"></div>
    <button class="btn btn-add" id="addBtn" type="button">＋ 新增點單人</button>
  </div>

  <button class="btn btn-submit" id="submitBtn" type="button">送出計算</button>
  <button class="btn btn-reset" id="resetBtn" type="button">全部清除</button>

  <div id="error" class="msg err hidden"></div>

  <div id="result" class="card hidden" style="margin-top:16px;">
    <h2>計算結果</h2>
    <div class="summary" id="summary"></div>
    <table>
      <thead>
        <tr>
          <th>姓名</th>
          <th>點單</th>
          <th>比例</th>
          <th>分攤費用</th>
          <th>應付</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
      <tfoot id="tfoot"></tfoot>
    </table>
    <div id="warn" class="msg warn hidden"></div>
    <p class="hint">分攤費用 = (外送費 + 平台費) × 個人點單 ÷ 所有人點單合計。金額四捨五入到整數，並自動調整尾差，確保加總等於總金額。</p>
  </div>
</div>

<script>
(function () {
  var peopleEl = document.getElementById('people');
  var errorEl = document.getElementById('error');
  var resultEl = document.getElementById('result');
  var STORAGE_KEY = 'delivery-split-v1';

  function num(v) {
    var n = parseFloat(v);
    return isFinite(n) ? n : 0;
  }
  function fmt(n) {
    return Number(n).toLocaleString('zh-TW', { maximumFractionDigits: 2 });
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function addPerson(name, price) {
    var row = document.createElement('div');
    row.className = 'person';
    row.innerHTML =
      '<input type="text" class="p-name" placeholder="姓名">' +
      '<input type="number" class="p-price" min="0" step="any" inputmode="decimal" placeholder="點單金額">' +
      '<button type="button" class="del" aria-label="刪除">✕</button>';
    row.querySelector('.p-name').value = name || '';
    row.querySelector('.p-price').value = price == null ? '' : price;
    row.querySelector('.del').addEventListener('click', function () {
      row.remove();
      renumber();
    });
    peopleEl.appendChild(row);
    renumber();
  }

  function renumber() {
    var rows = peopleEl.querySelectorAll('.person');
    rows.forEach(function (r, i) {
      r.querySelector('.p-name').placeholder = '姓名（例如：人員 ' + (i + 1) + '）';
    });
  }

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.remove('hidden');
    resultEl.classList.add('hidden');
  }

  function save() {
    try {
      var data = {
        orderTotal: document.getElementById('orderTotal').value,
        deliveryFee: document.getElementById('deliveryFee').value,
        platformFee: document.getElementById('platformFee').value,
        people: Array.prototype.map.call(peopleEl.querySelectorAll('.person'), function (r) {
          return { name: r.querySelector('.p-name').value, price: r.querySelector('.p-price').value };
        })
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {}
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      var d = JSON.parse(raw);
      document.getElementById('orderTotal').value = d.orderTotal || '';
      document.getElementById('deliveryFee').value = d.deliveryFee || '';
      document.getElementById('platformFee').value = d.platformFee || '';
      (d.people || []).forEach(function (p) { addPerson(p.name, p.price); });
      return (d.people || []).length > 0;
    } catch (e) { return false; }
  }

  function calculate() {
    errorEl.classList.add('hidden');
    var orderTotal = num(document.getElementById('orderTotal').value);
    var delivery = num(document.getElementById('deliveryFee').value);
    var platform = num(document.getElementById('platformFee').value);

    var people = [];
    peopleEl.querySelectorAll('.person').forEach(function (r, i) {
      var name = r.querySelector('.p-name').value.trim() || ('人員 ' + (i + 1));
      var priceStr = r.querySelector('.p-price').value;
      if (priceStr === '') return;
      people.push({ name: name, price: num(priceStr) });
    });

    if (people.length === 0) return showError('請至少新增一位點單人並輸入金額。');
    if (people.some(function (p) { return p.price < 0; }) || orderTotal < 0 || delivery < 0 || platform < 0)
      return showError('金額不可為負數。');

    var sumPrice = people.reduce(function (s, p) { return s + p.price; }, 0);
    if (sumPrice <= 0) return showError('所有人的點單金額加總必須大於 0。');

    var fee = delivery + platform;
    var grandTotal = orderTotal + fee;
    // 若點單金額欄位留空，則以個人點單加總為準
    if (orderTotal === 0) { orderTotal = sumPrice; grandTotal = sumPrice + fee; }

    // 先算每人實際分攤（未四捨五入），再用最大餘數法讓整數加總剛好等於總額
    var exactPays = people.map(function (p) {
      return p.price + fee * (p.price / sumPrice);
    });
    var targetTotal = Math.round(sumPrice + fee);
    var floors = exactPays.map(function (v) { return Math.floor(v); });
    var remain = targetTotal - floors.reduce(function (a, b) { return a + b; }, 0);
    var order = exactPays
      .map(function (v, i) { return { i: i, frac: v - Math.floor(v) }; })
      .sort(function (a, b) { return b.frac - a.frac; });
    for (var k = 0; k < remain && k < order.length; k++) floors[order[k].i] += 1;

    var tbody = document.getElementById('tbody');
    tbody.innerHTML = '';
    var sumShare = 0, sumPay = 0;
    people.forEach(function (p, i) {
      var ratio = p.price / sumPrice;
      var pay = floors[i];
      var share = pay - p.price;
      sumShare += share;
      sumPay += pay;
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + esc(p.name) + '</td>' +
        '<td>' + fmt(p.price) + '</td>' +
        '<td>' + (ratio * 100).toFixed(1) + '%</td>' +
        '<td>' + fmt(share) + '</td>' +
        '<td class="pay">' + fmt(pay) + '</td>';
      tbody.appendChild(tr);
    });

    document.getElementById('tfoot').innerHTML =
      '<tr><td>合計</td><td>' + fmt(sumPrice) + '</td><td>100%</td><td>' + fmt(sumShare) + '</td><td>' + fmt(sumPay) + '</td></tr>';

    document.getElementById('summary').innerHTML =
      '<div><small>點單金額</small><b>' + fmt(orderTotal) + '</b></div>' +
      '<div><small>外送費 + 平台費</small><b>' + fmt(fee) + '</b></div>' +
      '<div class="total"><small>總金額（點單 + 外送費 + 平台費）</small><b>' + fmt(grandTotal) + '</b></div>';

    var warn = document.getElementById('warn');
    if (Math.abs(sumPrice - orderTotal) > 0.005) {
      warn.textContent = '注意：個人點單加總（' + fmt(sumPrice) + '）與你輸入的點單金額（' + fmt(orderTotal) +
        '）不一致，目前分攤比例以個人點單加總計算。';
      warn.classList.remove('hidden');
    } else {
      warn.classList.add('hidden');
    }

    resultEl.classList.remove('hidden');
    resultEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    save();
  }

  document.getElementById('addBtn').addEventListener('click', function () {
    addPerson();
    var inputs = peopleEl.querySelectorAll('.p-name');
    inputs[inputs.length - 1].focus();
  });
  document.getElementById('submitBtn').addEventListener('click', calculate);
  document.getElementById('resetBtn').addEventListener('click', function () {
    if (!confirm('確定要清除所有資料嗎？')) return;
    ['orderTotal', 'deliveryFee', 'platformFee'].forEach(function (id) {
      document.getElementById(id).value = '';
    });
    peopleEl.innerHTML = '';
    addPerson(); addPerson();
    resultEl.classList.add('hidden');
    errorEl.classList.add('hidden');
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') calculate();
  });

  if (!load()) { addPerson(); addPerson(); }
})();
</script>
</body>
</html>
